<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img { width: 28px; height: 28px; }
    .header h1 {
      font-size: 15px;
      margin: 0;
      color: #00d4ff;
    }
    .desc {
      font-size: 12px;
      color: #999;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #00d4ff, #0090ff);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    button:hover { opacity: .85; }
    button:active { opacity: .7; }
    .status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      color: #666;
    }
    .status.ok { color: #4caf50; }
    .status.err { color: #f44336; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon48.png" alt="PF Inspector">
    <h1>PrimeFaces Inspector</h1>
  </div>
  <p class="desc">Abre el panel de inspección de widgets de PrimeFaces en la página actual.</p>
  <button id="btnOpen">Abrir Inspector</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
